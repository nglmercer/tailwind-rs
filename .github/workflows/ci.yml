name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run foundation benchmark
        run: cargo bench -p utilitycss-bench
      - name: Check WASM target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p utilitycss-wasm --target wasm32-unknown-unknown
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Check JavaScript adapters
        run: npm run lint
      - name: Typecheck JavaScript adapters
        run: npm run typecheck
      - name: Build JavaScript adapters
        run: npm run build
      - name: Test JavaScript adapters
        run: npm test

  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build native target
        run: npm run build:native --workspace=@utilitycss/napi -- --target ${{ matrix.target }}
      - name: Build Node adapter
        run: npm run build --workspace=@utilitycss/node
      - name: Run native adapter smoke tests
        run: npm test --workspace=@utilitycss/node
