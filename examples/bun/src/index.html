<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth components · utilitycss + Bun</title>
    <link rel="stylesheet" href="utilitycss" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        margin: 0 auto;
        max-width: 56rem;
      }

      .auth-panel {
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .auth-kicker {
        color: #6b7280;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .auth-title {
        margin: 0.5rem 0 0;
        color: #111827;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        line-height: 1.05;
      }

      .auth-copy {
        color: #4b5563;
        line-height: 1.6;
      }

      .auth-label {
        display: block;
        color: #111827;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .auth-input {
        display: block;
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        color: #111827;
        outline: none;
      }

      .auth-input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .auth-button {
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: transform 120ms ease, opacity 120ms ease;
      }

      .auth-button:hover {
        transform: translateY(-1px);
      }

      .auth-button:disabled {
        cursor: wait;
        opacity: 0.65;
        transform: none;
      }

      .auth-link {
        color: #4338ca;
        cursor: pointer;
        font-weight: 700;
        text-decoration: none;
      }

      .auth-link:hover {
        text-decoration: underline;
      }

      .auth-status {
        border-radius: 0.5rem;
        font-size: 0.875rem;
        line-height: 1.45;
      }

      .auth-status[data-kind="error"] {
        background: #fef2f2;
        color: #991b1b;
      }

      .auth-status[data-kind="success"] {
        background: #ecfdf5;
        color: #065f46;
      }

      .auth-feature {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.16);
      }

      .auth-feature strong {
        display: block;
        color: #fff;
      }

      .auth-feature span {
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .auth-tab[aria-selected="true"] {
        background: #fff;
        color: #111827;
      }
    </style>
  </head>
  <body class="min-h-screen bg-black p-4 text-white">
    <main id="app" class="w-full"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
